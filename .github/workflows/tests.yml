name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-suite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with provider extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 \
            | tee "${RUNNER_TEMP}/test-output.txt"
          # Provider extras are installed above, so no adapter test should skip.
          # A skip here means an extra is missing or an adapter import broke.
          if grep -qE 'skipped=[1-9]' "${RUNNER_TEMP}/test-output.txt"; then
            echo "::error::Tests were skipped; provider adapter tests must execute."
            exit 1
          fi

      - name: Run end-to-end matrix
        run: |
          ./scripts/run_test_matrix.sh
